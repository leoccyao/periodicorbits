name: periodicorbits
channels:
  - pytorch
  - conda-forge
  - nodefaults
dependencies:
  # Interpreter and direct numerical/runtime dependencies from the urop environment.
  - python=3.11.3
  - pytorch=2.0.1
  - numpy=1.24.3
  - scipy=1.10.1
  - pandas=2.1.0
  - matplotlib=3.7.1

  # Direct tooling needed to open and execute the included notebooks.
  - notebook=6.5.7
  - ipykernel=6.23.1
